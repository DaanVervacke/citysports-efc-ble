name: Gate

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
        resolution: [highest, lowest-direct]

    continue-on-error: ${{ matrix.python-version == '3.15' }}

    env:
      UV_RESOLUTION: ${{ matrix.resolution }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}-${{ matrix.resolution }}

      - name: Sync dependencies
        run: |
          if [ "${{ matrix.resolution }}" = "lowest-direct" ]; then
            uv lock
          fi
          uv sync --locked --all-groups

      - name: Run check gate
        run: uv run python -m scripts.check

      - name: Build and verify wheel
        run: |
          uv build --no-sources
          uv run python -c "import glob, sys, zipfile; w = glob.glob('dist/*.whl')[0]; names = zipfile.ZipFile(w).namelist(); sys.exit(0 if 'citysports_efc_ble/py.typed' in names else 'py.typed missing from wheel: ' + w)"
          uv venv /tmp/wheel-smoke
          uv pip install --python /tmp/wheel-smoke/bin/python dist/*.whl
          cd /tmp && /tmp/wheel-smoke/bin/python -c "from citysports_efc_ble import EfcClient, is_efc_advertisement"
